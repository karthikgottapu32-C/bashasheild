databases:
  - name: bhashashield-postgres
    databaseName: bhashashield
    user: bhashashield_admin
    plan: free
    region: oregon
    ipAllowList: [] # internal connection only

services:
  # BhashaShield Enterprise Intelligence Engine & API
  - type: web
    name: bhashashield-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bhashashield-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://bhashashield-api.onrender.com,https://bhashashield.onrender.com"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
