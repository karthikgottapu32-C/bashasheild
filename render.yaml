services:
  # BhashaShield Enterprise Intelligence Engine & API
  - type: web
    name: bhashashield-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_POSTGRES
        value: "false"
      - key: CORS_ORIGINS
        value: "https://bhashashield-api.onrender.com,https://bhashashield.onrender.com"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
